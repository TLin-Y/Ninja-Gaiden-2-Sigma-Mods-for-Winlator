; DON'T TOUCH IF YOU DO NOT KNOW WHAT YOU'RE DOING
; By default, the recommended values are already set and the ini will load when the game is first launch, if you want to make changes without reloading the game, press the UP ARROW KEY, THE GAME WINDOW MUST BE IN FOCUS UNLESS YOU SET windowAlwaysReadInputs = true under [DEBUG]
; I'll add a bunch more next update



[DELIMB]
; global delimb multiplier for all attacks 
globalDelimbMulp = 1.0
; higher delimb multiplier used for certain attacks such as CLAW ->Y / TONFA 360Y
highDelimbMulp = 1.80
; Damage multiplier for guillotine throw 
guilthrowDmgMulp = 1.50
; Scythe will ignore globalDelimbMulp and use this value instead
scytheDelimbMulp = 4.00
; Fang will ignore globalDelimbMulp and use this value instead
emnaDelimbMulp = 3.00
; Applies to female weapons
femaleDelimbMulp = 3.50
;BOW ET/UT (dmg modifier will be added next update)
bowChargeDelimbMulp = 5.00


[SHOP]
; essence cost to upgrade weapons (applies to all diffs)
weaponUpgradeCost = 30000
[WATERDRAGON]
waterDragonHPMulp = 0.50


[GRAPHICS]
; how long corpses will be visible for chapter 6,7, and Ayane - as too many lycan corpses will cause graphical errors
corpseTimerLycans = 300.00
; character models will have a shiner/glossy look similar to NG2 - CHANGING THIS WHILE IN LEVEL CAN CAUSE INACCURACY
shine = false
; BLOOM
bloomIntensity = 0.25

[CAMERA]
; field of view, if you want to go higher, 1.10 is the sweet spot, 1.00 is default
fov = 1.00

; moveable camera during action sequences such as OT, IZUNA, UT, ETC etc..
isFreeCamAll = false

; moveable camera during Izuna drop only
isFreeCamIzunaOnly = true

; stretches/compresses the game image, does nothing currently
imageSizeH = 0xFF

[GAMEPLAY]
; attack animations will feel more smooth "butter" like
animationSmoothing = false

; Blurs game when using quick select
quickSelectBlur = false

; HIT STOP FOR ATTACKS Enter a value between 0-3, 0 = no hitstop and the higher you go the more "hitstop" 3 is Sigma 2 value. Will not work if animationSmoothing is set to true
microStutter = 0

; Flying swallow will briefly flash the screen white like NG2
whiteFlash = true

; disables all essence drops (not tested for bugs, use at own risk)
disableEssence = false

; provides player with additonal iFrames during certain airborne states, WIP leave as false if buggy
hasFullAirborneIframes = false


; always aggressive A.I (unless skill based aggression is turned on)
; the HP amount healing items restore is reduced by 50%
; ET / UT will not delimb but will still deal damage
; brand new spawns (make a backup copy of the mods folder 
and copy the .dat files from NGS2B/Ultimate Ninja
; IS shuriken must be purchased at muramasa shop and have max inv qty of 20
; settings in the INI that make the game easier will be ignored in this difficulty


UltimateNinja = false


[ENEMYAI]
; Restores NG2 Grab Speed FALSE = NG2 TRUE = SIGMA 2
; Will apply to all difficulty variant
isNinjaGrabSpeed = false
greyNinjaGrabSpeed = false
zedGrabSpeed = false
lizGrabSpeedTail = true

[SPAWN]
; disables minions alongside rasetsu in the final battle (warrior & master)
ch1RasetsuDisableMinions = false
skipCH1StatueEncOne = false
skipCH4Statue = true

; HELPERS
[DEBUG]
; move through objects
noClip = false

; enemies won't move
freezeEnemies = false
; set everything here in the delimb header to -1.0 as well
disableDelimb = false

; the game window will always read your inputs so you can still play even if the window is not in focus turn off if causing
; input lag / issues
windowAlwaysReadInputs = false

[AUDIO]
; original is 0x3B
mainMenuTrack = 0x3B
; original is 0x45
ch1HeroTrack = 0x45
; don't touch
ch14HeroTrack = 0x4D
; Audio queue to let user know that config has been re-applied (when you press the up arrow key to re-inject config)
configChime = false

[INTERFACE]
vibrantMainMenu = true
saveLastFrame = false

; THESE ARE NOT EXTENSIVELY TESTED
[DANGERZONE]
; currently non-functioning - forgot and got tired lol
autoSkipCutScene = false
; Resume instantly on death
instantResume = false


;ADVANCED SECTION

; attackAnim, cancelAnim, cancelInput
; you can retrieve more combinations from register RAX NINJA GAIDEN SIGMA2.exe+B5CC70 
; BUTTON ANNOTATION EXAMPLE IS XBOX
; 0x00000010 = A | 0x00000080 = Y | 0x00000020 = B | 0x00000040 = X
; 0x00001000 = L1 | 0x00002000 = R1 | 0x00004000 = R1 | 0x00008000 = R2
; 0x00000400 = LEFTHUMP PUSHED IN | 0x00000800 = RIGHTHUMP PUSHED IN
; 0x0000C000 = L1 + L2


[ATTACKCANCELS]
; Dragonsword ET into SIGMA 1 UT, cancelled by pressing Y
0x1001 = 0x03F1,0x0931,0x00001000
0x1002 = 0x2002,0x3002,0x00000020
0x1003 = 0xFFFF,0xFFFF,0xFFFFFFFF
